services:
  api:
    build: .
    image: discharge-sync-api:latest
    container_name: discharge-sync-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/discharge.db
    volumes:
      - discharge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  discharge-data:
